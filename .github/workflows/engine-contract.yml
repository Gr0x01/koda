# Daily early warning on the upstream engines (both `claude` and `codex`). Koda pins no engine version:
# the app downloads upstream `latest` at runtime and a build bundles whatever is newest when it is made
# (.koda/memory/engine-updates.md). Each job resolves the current upstream release, downloads + verifies
# that build (linux), and drives it through the engine-contract smoke test (the real driver). Green →
# nothing to do, the version is remembered as passed; red → opens or updates an issue, because that
# engine is already what the app runs.
#
# Each job is dormant until its API-key repo secret is set — the smoke tests bill to the API in CI
# (claude: ANTHROPIC_API_KEY, codex: OPENAI_API_KEY). Without the key the job no-ops cleanly (never fails,
# never opens noise). Codex bills to a ChatGPT OAuth login it can't do headlessly, so CI vets with an
# OpenAI API key instead (buildEngineEnv maps it in).
name: Engine Contract

concurrency:
  group: engine-contract
  cancel-in-progress: false

on:
  schedule:
    # Daily 06:00 UTC. Checking is cheap (a version lookup, no engine spawn). Daily (not weekly) so a new
    # release — e.g. a flagship model launch — is caught within ~1 day instead of up to 7.
    #
    # The API-billing smoke test must run once per upstream version, not once per day. A version that
    # passed is remembered by a cache entry keyed on it; a version that failed is remembered by its open
    # issue. Without the second guard a red run re-billed the identical broken version every night, which
    # ran 17 nights straight in August 2026. A passed entry unused for a week is evicted, so a quiet
    # upstream costs at most one repeat run a week.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Claude engine version to test (blank = upstream latest). Always re-tests.'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  engine-contract:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve version + preconditions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not set — skipping engine contract run."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          TARGET="${{ inputs.version }}"
          # The same index the app's runtime download and the build's bundling step read.
          [ -z "$TARGET" ] && TARGET=$(curl -fsSL --retry 3 https://downloads.claude.ai/claude-code-releases/latest)
          if [[ ! "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid Claude version from upstream: $TARGET"; exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "::notice::target=$TARGET"
          # Retry a failed version when its issue is closed, when a newer version ships, or on a manual
          # dispatch — which is the escape hatch for a failure that was transient rather than real.
          if [ -z "$FORCE" ] && gh issue list --state open --limit 200 --json title --jq '.[].title' \
            | grep -Fxq "Claude engine $TARGET failed the Koda contract"; then
            echo "::notice::Claude $TARGET already failed and its issue is still open — not re-testing (close it or dispatch manually to retry)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up a recorded pass for this version
        id: seen
        if: steps.v.outputs.go == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .engine-contract-pass
          key: engine-contract-claude-${{ steps.v.outputs.target }}
          lookup-only: true

      - name: Download + verify candidate binary
        if: steps.v.outputs.go == 'true' && steps.seen.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ steps.v.outputs.target }}
        run: node scripts/fetch-candidate-engine.mjs --version "$TARGET" --platform linux-x64 --out /tmp/candidate

      - name: Engine contract smoke test
        if: steps.v.outputs.go == 'true' && steps.seen.outputs.cache-hit != 'true'
        env:
          KODA_ENGINE_CANDIDATE: /tmp/candidate/claude
          # The checks assert stream-json plumbing, not model judgment, and this run bills the API — so pin
          # a mid-tier model instead of inheriting the CLI's Opus default. See the note in smoke.test.ts.
          KODA_ENGINE_CONTRACT_MODEL: sonnet
        run: npm run test:engine-contract

      - name: Mark this version as passed
        if: success() && steps.v.outputs.go == 'true' && steps.seen.outputs.cache-hit != 'true'
        run: echo "${{ steps.v.outputs.target }}" > .engine-contract-pass
      - name: Record the pass
        if: success() && steps.v.outputs.go == 'true' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .engine-contract-pass
          key: engine-contract-claude-${{ steps.v.outputs.target }}

      - name: Open failure issue (regressed)
        if: failure() && steps.v.outputs.attempted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          TARGET="${TARGET:-unknown}"
          TITLE="Claude engine $TARGET failed the Koda contract"
          BODY="Upstream Claude \`$TARGET\` did not pass Koda's engine contract. The app follows upstream latest, so installs may already be running this version. The failure may be version resolution, candidate verification, or the real engine contract. Close this issue to let the daily check retry \`$TARGET\`. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Exact title match, not `in:title` search: the resolve step reads these same titles back to decide
          # whether a version already failed, and a fuzzy match across adjacent version numbers would make
          # the two disagree — either skipping a version that never ran, or filing a fresh issue every night.
          EXISTING=$(gh issue list --state open --limit 200 --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  codex-contract:
    needs: engine-contract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve version + preconditions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY not set — skipping codex contract run."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          # The workflow_dispatch `version` input is Claude-only (different version scheme) — Codex always
          # resolves its own latest so a Claude version can't be mis-fed here.
          # `releases/latest` is GitHub's own "newest non-prerelease, non-draft" — one cheap call, and the
          # same one the app and the build make. The full --paginate sweep it replaced walked every release
          # page and flaked two separate ways (multi-line $GITHUB_OUTPUT writes, then mid-stream
          # CANCELs/504s from GitHub), failing nights when nothing was wrong. Retries cover the endpoint
          # itself blipping; a non-rust-v tag falls through to the version check below and fails loudly.
          TAG=""
          for attempt in 1 2 3; do
            TAG=$(gh api repos/openai/codex/releases/latest --jq '.tag_name') && break
            echo "::warning::releases/latest attempt $attempt failed; retrying"
            sleep 10
          done
          TARGET="${TAG#rust-v}"
          if [ -z "$TARGET" ] || [[ ! "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid Codex version from upstream: $TARGET"; exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "::notice::target=$TARGET"
          # Same guard as the Claude job: an already-failed version must not re-bill the API every night.
          if [ -z "$FORCE" ] && gh issue list --state open --limit 200 --json title --jq '.[].title' \
            | grep -Fxq "Codex engine $TARGET failed the Koda contract"; then
            echo "::notice::Codex $TARGET already failed and its issue is still open — not re-testing (close it or dispatch manually to retry)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up a recorded pass for this version
        id: seen
        if: steps.v.outputs.go == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .engine-contract-pass
          key: engine-contract-codex-${{ steps.v.outputs.target }}
          lookup-only: true

      - name: Download + extract candidate binary
        if: steps.v.outputs.go == 'true' && steps.seen.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ steps.v.outputs.target }}
        run: node scripts/fetch-candidate-codex.mjs --version "$TARGET" --triple x86_64-unknown-linux-musl --out /tmp/candidate-codex

      - name: Codex contract smoke test
        if: steps.v.outputs.go == 'true' && steps.seen.outputs.cache-hit != 'true'
        env:
          KODA_CODEX_CANDIDATE: /tmp/candidate-codex/codex
        run: npm run test:engine-contract-codex

      - name: Mark this version as passed
        if: success() && steps.v.outputs.go == 'true' && steps.seen.outputs.cache-hit != 'true'
        run: echo "${{ steps.v.outputs.target }}" > .engine-contract-pass
      - name: Record the pass
        if: success() && steps.v.outputs.go == 'true' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .engine-contract-pass
          key: engine-contract-codex-${{ steps.v.outputs.target }}

      - name: Open failure issue (regressed)
        if: failure() && steps.v.outputs.attempted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          TARGET="${TARGET:-unknown}"
          TITLE="Codex engine $TARGET failed the Koda contract"
          BODY="Upstream Codex \`$TARGET\` did not pass Koda's app-server contract. The app follows upstream latest, so installs may already be running this version. The failure may be version resolution, candidate verification, or the real app-server contract. Close this issue to let the daily check retry \`$TARGET\`. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Exact title match — the resolve step reads these titles back; see the note in the Claude job.
          EXISTING=$(gh issue list --state open --limit 200 --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
