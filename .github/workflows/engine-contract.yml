# Daily guard on the bundled engines (both `claude` and `codex`). Each job resolves the current `stable`
# release (our pin policy — NOT `latest`/bleeding-edge; see architecture/engine-updates.md), and if it's
# ahead of the version pinned in scripts/fetch-engine.mjs, downloads + verifies that build (linux) and
# drives it through the engine-contract smoke test (the real driver). Green → opens and merges a tightly
# scoped bot PR; red → opens or updates an issue before the candidate can enter a nightly.
#
# Each job is dormant until its API-key repo secret is set — the smoke tests bill to the API in CI
# (claude: ANTHROPIC_API_KEY, codex: OPENAI_API_KEY). Without the key the job no-ops cleanly (never fails,
# never opens noise). Codex bills to a ChatGPT OAuth login it can't do headlessly, so CI vets with an
# OpenAI API key instead (buildEngineEnv maps it in).
name: Engine Contract

concurrency:
  group: engine-contract
  cancel-in-progress: false

on:
  schedule:
    # Daily 06:00 UTC. Checking is cheap (a version compare, no engine spawn). Daily (not weekly) so a new
    # release — e.g. a flagship model launch — is caught within ~1 day instead of up to 7.
    #
    # The API-billing smoke test runs when `stable` is ahead of the pin — which is NOT the same as "on days
    # stable advanced", because the pin only moves after a fully green run merges its bump PR. A red nightly
    # leaves the pin behind forever, so every following night re-tested the same candidate and re-billed for
    # it; that ran 17 nights straight in August 2026. The already-failed guard in the resolve step below is
    # what bounds that, and it is the reason this cron can stay daily.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Engine version to test (blank = npm `stable` dist-tag)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  engine-contract:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve versions + preconditions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not set — skipping engine contract run."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          PINNED=$(node -p "require('fs').readFileSync('scripts/fetch-engine.mjs','utf8').match(/PINNED_VERSION\s*=\s*'([^']+)'/)[1]")
          TARGET="${{ inputs.version }}"
          # Pin policy: track the `stable` dist-tag, NOT `latest`. See architecture/engine-updates.md.
          [ -z "$TARGET" ] && TARGET=$(npm view @anthropic-ai/claude-code dist-tags.stable)
          if [[ ! "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid Claude version from upstream: $TARGET"; exit 1
          fi
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "::notice::pinned=$PINNED stable-target=$TARGET"
          ORDER=$(node --input-type=module -e "import { compareStableVersions } from './scripts/apply-engine-bump.mjs'; console.log(compareStableVersions(process.argv[1], process.argv[2]))" "$TARGET" "$PINNED")
          if [ "$ORDER" -le 0 ]; then
            echo "::notice::Claude pin $PINNED is already at or ahead of stable $TARGET — nothing to test."
            echo "go=false" >> "$GITHUB_OUTPUT"
          # A candidate that already failed must not be re-tested nightly. The smoke test bills the API in
          # full, and a failing check bills MORE than a passing one (each check burns its whole timeout with
          # the model still working), so a red nightly used to charge for the identical broken version every
          # day until someone read the bill. The failure issue below is already the record of that attempt;
          # this reads it back. Retry when the issue is closed, when a newer version ships, or on a manual
          # dispatch — which is the escape hatch for a failure that was transient rather than real.
          elif [ -z "$FORCE" ] && gh issue list --state open --limit 200 --json title --jq '.[].title' \
            | grep -Fxq "Automated Claude engine update failed for $TARGET"; then
            echo "::notice::Claude $TARGET already failed and its issue is still open — not re-testing (close it or dispatch manually to retry)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download + verify candidate binary
        if: steps.v.outputs.go == 'true'
        env:
          TARGET: ${{ steps.v.outputs.target }}
        run: node scripts/fetch-candidate-engine.mjs --version "$TARGET" --platform linux-x64 --out /tmp/candidate

      # The contract executes the Linux build, while Koda ships darwin-arm64. Verify that the exact
      # bundled-platform candidate exists and matches Anthropic's signed manifest before changing the pin.
      - name: Download + verify bundled-platform candidate
        if: steps.v.outputs.go == 'true'
        env:
          TARGET: ${{ steps.v.outputs.target }}
        run: node scripts/fetch-candidate-engine.mjs --version "$TARGET" --platform darwin-arm64 --out /tmp/candidate-mac

      - name: Engine contract smoke test
        if: steps.v.outputs.go == 'true'
        env:
          KODA_ENGINE_CANDIDATE: /tmp/candidate/claude
          # The checks assert stream-json plumbing, not model judgment, and this run bills the API — so pin
          # a mid-tier model instead of inheriting the CLI's Opus default. See the note in smoke.test.ts.
          KODA_ENGINE_CONTRACT_MODEL: sonnet
        run: npm run test:engine-contract

      # Watch the server-advertised min_version floor — the one thing that breaks a frozen bundle (see
      # architecture/engine-updates.md + the shared-home drift note). The smoke test above authenticates and
      # drives real turns, which populates ~/.claude.json's cachedGrowthBookFeatures, so we read the floor
      # off that — no extra engine spawn. Only meaningful when the smoke test ran (go==true); in steady state
      # a newly available stable candidate is checked before the pin can move.
      - name: Check server version floor
        id: floor
        if: success() && steps.v.outputs.go == 'true'
        run: node scripts/check-engine-floor.mjs

      # Surface a rising floor as a deduped tracking issue (a green-run ::warning:: would go unseen). Only
      # one open issue at a time; re-runs update it rather than nagging on every run.
      - name: Flag approaching floor
        if: success() && steps.v.outputs.go == 'true' && (steps.floor.outputs.level == 'warn' || steps.floor.outputs.level == 'critical')
        env:
          GH_TOKEN: ${{ github.token }}
          LEVEL: ${{ steps.floor.outputs.level }}
          FLOOR: ${{ steps.floor.outputs.floor }}
          FLOORKEY: ${{ steps.floor.outputs.floorKey }}
          PINNED: ${{ steps.floor.outputs.pinned }}
          BEHIND: ${{ steps.floor.outputs.patchesBehind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Engine server floor approaching pinned version ($FLOORKEY)"
          BODY="Server-advertised floor \`$FLOOR\` (\`$FLOORKEY\`) vs Koda's pinned bundled engine \`$PINNED\` — **$BEHIND patch releases** of headroom left (level: **$LEVEL**). If the floor reaches the pin, the frozen bundled engine starts refusing to run. Plan a re-bundle above the floor. Background: architecture/engine-updates.md. Run: $RUN_URL"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "engine" || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Apply guarded version bump
        if: success() && steps.v.outputs.go == 'true'
        env:
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          node scripts/apply-engine-bump.mjs apply --engine claude --version "$TARGET"
          node scripts/apply-engine-bump.mjs verify --engine claude --version "$TARGET"

      # GITHUB_TOKEN-authored PRs do not recursively trigger ordinary pull_request workflows. Run the
      # repository's complete portable CI gate on the exact edited tree before this narrow bot PR merges.
      # The unit suite resolves resources/engine/linux-x64/claude (adapter/pack tests; the lab's check
      # lane installs it the same way). The bump above moved the pin to $TARGET, and /tmp/candidate
      # already holds $TARGET's manifest-verified linux binary — install that, no second download.
      - name: Install engine for the unit suite
        if: success() && steps.v.outputs.go == 'true'
        run: |
          mkdir -p resources/engine/linux-x64
          cp /tmp/candidate/claude resources/engine/linux-x64/claude
      - name: Portable repository gate
        if: success() && steps.v.outputs.go == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run lint
          npm test
          npm run build

      - name: Open and merge guarded version-bump PR
        if: success() && steps.v.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          node scripts/apply-engine-bump.mjs verify --engine claude --version "$TARGET"
          BRANCH="engine/bump-claude-$TARGET-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md scripts/fetch-engine.mjs
          git commit -m "chore(engine): bump bundled Claude CLI to $TARGET"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(engine): bump bundled Claude CLI to $TARGET" \
            --body "Automated: both upstream binaries verified, the real Koda engine contract passed against \`$TARGET\`, the diff guard accepted only the pin and changelog, and the portable repository gate passed. Safe engine bumps merge themselves and enter the next nightly.")
          gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - name: Open failure issue (regressed)
        if: failure() && steps.v.outputs.attempted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          TARGET="${TARGET:-unknown}"
          TITLE="Automated Claude engine update failed for $TARGET"
          BODY="Koda stopped the automated update for \`$TARGET\` before nightly publication. The failure may be version resolution, candidate verification, the real engine contract, the exact-diff guard, portable CI, or guarded PR integration. Close this issue to let the nightly retry \`$TARGET\`. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Exact title match, not `in:title` search: the resolve step reads these same titles back to decide
          # whether a candidate already failed, and a fuzzy match across adjacent version numbers would make
          # the two disagree — either skipping a version that never ran, or filing a fresh issue every night.
          EXISTING=$(gh issue list --state open --limit 200 --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  codex-contract:
    needs: engine-contract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Claude may have auto-merged a pin earlier in this same run. Start Codex from the current
          # private main so two independent engine updates never race from one stale base.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve versions + preconditions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY not set — skipping codex contract run."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          PINNED=$(node -p "require('fs').readFileSync('scripts/fetch-engine.mjs','utf8').match(/PINNED_CODEX_VERSION\s*=\s*'([^']+)'/)[1]")
          # Pin policy: latest GitHub-releases `stable` (newest non-prerelease `rust-v*` tag), NOT prereleases.
          # The workflow_dispatch `version` input is Claude-only (different version scheme) — Codex always
          # resolves its own stable so a Claude version can't be mis-fed here.
          # --paginate + --jq emits one result PER PAGE (multi-line broke the $GITHUB_OUTPUT write and
          # failed this job daily) — filter the empty pages and take the newest across all of them.
          TAG=$(gh api repos/openai/codex/releases --paginate \
            --jq 'map(select(.prerelease==false and (.tag_name|startswith("rust-v")))) | first | select(. != null) | .tag_name' \
            | head -n1)
          TARGET="${TAG#rust-v}"
          if [ -z "$TARGET" ] || [[ ! "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid Codex version from upstream: $TARGET"; exit 1
          fi
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "::notice::pinned=$PINNED stable-target=$TARGET"
          ORDER=$(node --input-type=module -e "import { compareStableVersions } from './scripts/apply-engine-bump.mjs'; console.log(compareStableVersions(process.argv[1], process.argv[2]))" "$TARGET" "$PINNED")
          if [ "$ORDER" -le 0 ]; then
            echo "::notice::Codex pin $PINNED is already at or ahead of stable $TARGET — nothing to test."
            echo "go=false" >> "$GITHUB_OUTPUT"
          # Same guard as the Claude job: an already-failed candidate must not re-bill the API every night.
          elif [ -z "$FORCE" ] && gh issue list --state open --limit 200 --json title --jq '.[].title' \
            | grep -Fxq "Automated Codex engine update failed for $TARGET"; then
            echo "::notice::Codex $TARGET already failed and its issue is still open — not re-testing (close it or dispatch manually to retry)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download + extract candidate binary
        if: steps.v.outputs.go == 'true'
        env:
          TARGET: ${{ steps.v.outputs.target }}
        run: node scripts/fetch-candidate-codex.mjs --version "$TARGET" --triple x86_64-unknown-linux-musl --out /tmp/candidate-codex

      - name: Codex contract smoke test
        if: steps.v.outputs.go == 'true'
        env:
          KODA_CODEX_CANDIDATE: /tmp/candidate-codex/codex
        run: npm run test:engine-contract-codex

      - name: Resolve bundled-platform checksum
        id: darwin
        if: success() && steps.v.outputs.go == 'true'
        env:
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          # Recompute the bundled-platform (darwin-arm64) tarball SHA the pin records — the smoke test ran
          # the linux build, but fetch-engine bundles the mac one, so its self-pinned checksum must match.
          DARWIN_SHA=$(curl -fsSL "https://github.com/openai/codex/releases/download/rust-v$TARGET/codex-aarch64-apple-darwin.tar.gz" | sha256sum | cut -d' ' -f1)
          if [[ ! "$DARWIN_SHA" =~ ^[a-f0-9]{64}$ ]]; then echo "::error::could not verify darwin tarball for $TARGET"; exit 1; fi
          echo "sha=$DARWIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Apply guarded version bump
        if: success() && steps.v.outputs.go == 'true'
        env:
          TARGET: ${{ steps.v.outputs.target }}
          DARWIN_SHA: ${{ steps.darwin.outputs.sha }}
        run: |
          node scripts/apply-engine-bump.mjs apply --engine codex --version "$TARGET" --darwin-sha "$DARWIN_SHA"
          node scripts/apply-engine-bump.mjs verify --engine codex --version "$TARGET" --darwin-sha "$DARWIN_SHA"

      # The unit suite resolves resources/engine/linux-x64/claude even in the Codex job (Claude
      # adapter/pack tests run in `npm test`), and this job downloads only the codex candidate.
      # Install the PINNED Claude engine the same verified way the candidate fetcher works.
      - name: Install pinned Claude engine for the unit suite
        if: success() && steps.v.outputs.go == 'true'
        run: |
          PINNED=$(node -p "require('fs').readFileSync('scripts/fetch-engine.mjs','utf8').match(/PINNED_VERSION\s*=\s*'([^']+)'/)[1]")
          node scripts/fetch-candidate-engine.mjs --version "$PINNED" --platform linux-x64 --out /tmp/pinned-claude
          mkdir -p resources/engine/linux-x64
          cp /tmp/pinned-claude/claude resources/engine/linux-x64/claude
      - name: Portable repository gate
        if: success() && steps.v.outputs.go == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run lint
          npm test
          npm run build

      - name: Open and merge guarded version-bump PR
        if: success() && steps.v.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.v.outputs.target }}
          DARWIN_SHA: ${{ steps.darwin.outputs.sha }}
        run: |
          node scripts/apply-engine-bump.mjs verify --engine codex --version "$TARGET" --darwin-sha "$DARWIN_SHA"
          BRANCH="engine/bump-codex-$TARGET-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md scripts/fetch-engine.mjs
          git commit -m "chore(engine): bump bundled Codex CLI to $TARGET"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(engine): bump bundled Codex CLI to $TARGET" \
            --body "Automated: the bundled-platform tarball verified, the real Koda app-server contract passed against \`$TARGET\`, the diff guard accepted only the pin, checksum, and changelog, and the portable repository gate passed. Safe engine bumps merge themselves and enter the next nightly.")
          gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - name: Open failure issue (regressed)
        if: failure() && steps.v.outputs.attempted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          TARGET="${TARGET:-unknown}"
          TITLE="Automated Codex engine update failed for $TARGET"
          BODY="Koda stopped the automated update for \`$TARGET\` before nightly publication. The failure may be version resolution, candidate verification, the real app-server contract, the exact-diff guard, portable CI, or guarded PR integration. Close this issue to let the nightly retry \`$TARGET\`. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Exact title match — the resolve step reads these titles back; see the note in the Claude job.
          EXISTING=$(gh issue list --state open --limit 200 --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
