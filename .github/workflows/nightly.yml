# The unattended nightly, on a disposable GitHub macOS runner.
#
# This replaces the launchd job on RB's Mac. Same orchestrator (`infra/release/nightly.mjs`), same gates,
# same outward writes — only the host changes. That host was the entire failure history: between Aug 17 and
# Sep 17 2026 the local runner was blocked three separate times, by a binary missing from launchd's PATH, a
# self-upgraded npm that rejected the committed lockfile, and an unreachable Koda Lab worker. None of those
# were release bugs. A runner that is rebuilt from scratch every night cannot drift, cannot be asleep at
# 03:00, and does not sit behind whatever network RB happens to be on.
#
# Dormant until its secrets exist: without them the job exits cleanly rather than failing nightly. Required
# secrets are listed in infra/release/README.md.
#
# What still belongs to RB's Mac: nothing in this flow. What still belongs to a human: cutting a *stable*
# release. This workflow only ever publishes prereleases, and stable installs refuse them.
name: Nightly

concurrency:
  group: nightly-release
  cancel-in-progress: false

on:
  schedule:
    # 09:00 UTC — after the 06:00 UTC Engine Contract run, so a Claude or Codex bump that merges this
    # morning is in the nightly built the same day instead of waiting for tomorrow.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Resolve the candidate and stop (no build, sign, or publish)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nightly:
    # arm64 runner: Koda ships darwin-arm64 and the release asserts a signed mac-arm64 app.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check for release secrets
        id: gate
        env:
          RELEASE_TOKEN: ${{ secrets.KODA_RELEASE_TOKEN }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$RELEASE_TOKEN" ] || [ -z "$MACOS_CERTIFICATE" ] || [ -z "$APPLE_ID" ]; then
            echo "::notice::release secrets not set — skipping. See infra/release/README.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # electron-builder signs from the login keychain. Build a throwaway one holding only the Developer ID
      # identity; the runner is destroyed afterwards, so it is never unlocked longer than this job.
      - name: Import signing identity
        if: steps.gate.outputs.go == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/koda-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo -n "$MACOS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Prove the identity is usable now, rather than discovering it after a 40-minute build.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::no Developer ID Application identity in the imported keychain"; exit 1; }

      # The orchestrator clones the private repo and pushes the curated public snapshot, so git itself needs
      # the release token — not just `gh`.
      - name: Authenticate git and gh
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.KODA_RELEASE_TOKEN }}
        run: |
          gh auth setup-git
          gh auth status

      - name: Run nightly
        if: steps.gate.outputs.go == 'true'
        env:
          KODA_NIGHTLY_HOSTED: '1'
          GH_TOKEN: ${{ secrets.KODA_RELEASE_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: ${{ runner.temp }}/koda-signing.keychain-db
          # The combined build OOMs on the runner default heap, same as the Linux CI job.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci --no-audit --no-fund
          node infra/release/nightly.mjs ${{ inputs.plan_only && 'plan' || 'run' }}
